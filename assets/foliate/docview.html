<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DocView</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src blob: data:; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ffffff;
  }
  foliate-view { height: 100%; width: 100%; }
  #err {
    display: none;
    padding: 2rem;
    font: 13px monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<foliate-view id="view"></foliate-view>
<pre id="err"></pre>

<script>
window.addEventListener('error', function (e) {
  var info = (e.filename || '?') + ':' + (e.lineno || 0) + ' -> ' + e.message
  // ResizeObserver loop errors are benign layout noise (keyboard opening,
  // rapid resizes); never treat them as fatal page errors.
  if (/ResizeObserver loop/i.test(e.message || '')) {
    console.error('BOOTERR (benign) ' + info)
    return
  }
  console.error('BOOTERR ' + info)
  window.flutter_inappwebview?.callHandler?.('onReflowError', info)
})
</script>

<script type="module">
import { makeBook } from './view.js'
import { fromRange } from './epubcfi.js'
import { Overlayer } from './overlayer.js'

const params = new URLSearchParams(location.search)
const src = params.get('src') ?? ''
const colorMode = params.get('color') ?? 'normal'
const goFraction = params.get('frac')
const goLocation = params.get('loc')

// Reader typography. Applied through pageCSS so it survives section loads (each
// section renders into its own document), and adjustable live via
// window.docviewSetTypography from the Flutter typography sheet.
const clampNum = (v, lo, hi, fallback) => {
  const n = parseFloat(v ?? '')
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback
}

let TYPO = {
  size: clampNum(params.get('size'), 70, 180, 100),        // percent
  spacing: clampNum(params.get('spacing'), 1.2, 2.2, 1.5), // line-height
}

const view = document.createElement('foliate-view')
document.body.append(view)

const notify = (name, payload) => {
  window.flutter_inappwebview?.callHandler?.(name, payload)
}

const showError = err => {
  const el = document.getElementById('err')
  el.style.display = 'block'
  el.textContent = String(err?.stack ?? err)
  console.error(err)
}

const pageCSS = () => `
    html {
        color-scheme: ${colorMode === 'dark' ? 'dark' : 'light'};
        background: ${THEME_VIS.bg};
        font-size: ${TYPO.size}%;
    }
    body {
        background: ${THEME_VIS.bg};
        filter: ${THEME_VIS.filter};
        -webkit-text-fill-color: ${THEME_VIS.fg};
    }
    :root { --bg: ${THEME_VIS.bg}; --fg: ${THEME_VIS.fg}; }
    h1, h2, h3, h4, h5, h6, p, li, blockquote, dd {
        color: ${THEME_VIS.fg};
    }
    a:link { color: ${THEME_VIS.fg}; }
    p, li, blockquote, dd { line-height: ${TYPO.spacing}; text-align: start; }
    pre { white-space: pre-wrap !important; }
`

// Each section renders into its own document, so restyling means rewriting the
// injected <style> in every live content document. renderer.setStyles is not
// available on this paginator, so do it directly.
const injectStyles = doc => {
  if (!doc?.head) return
  let el = doc.getElementById('docview-style')
  if (!el) {
    el = doc.createElement('style')
    el.id = 'docview-style'
    doc.head.append(el)
  }
  el.textContent = pageCSS()
}

const applyStyles = () => {
  for (const { doc } of view.renderer?.getContents?.() ?? []) injectStyles(doc)
}

const themeFor = mode =>
  mode === 'dark'
    ? { bg: '#241f1a', fg: '#e6ddcf', filter: 'saturate(0.85)' }
    : mode === 'sepia'
      ? { bg: '#f4ebd8', fg: '#40342a', filter: 'sepia(0.28) saturate(0.9)' }
      : { bg: '#ffffff', fg: '#201a15', filter: 'none' }

let THEME_VIS = themeFor(colorMode)

// Live theme switch: recolours the current page without reloading the book
// (a reload used to lose the WebView scroll/render position).
window.docviewSetColor = mode => {
  THEME_VIS = themeFor(mode)
  document.documentElement.style.background = THEME_VIS.bg
  document.body.style.background = THEME_VIS.bg
  applyStyles()
}

// Live typography switch: size is a percent of the base font, spacing is the
// line-height multiplier applied to body text.
window.docviewSetTypography = (size, spacing) => {
  const s = parseFloat(size)
  const sp = parseFloat(spacing)
  if (Number.isFinite(s)) TYPO.size = Math.min(180, Math.max(70, s))
  if (Number.isFinite(sp)) TYPO.spacing = Math.min(2.2, Math.max(1.2, sp))
  applyStyles()
}

const open = async () => {
  const book = await makeBook(src)
  await view.open(book)

  // --- annotation layer ------------------------------------------------------
  // foliate-view emits create-overlay when a section's overlay is (re)built;
  // we replay this section's annotations into it. draw-annotation asks us to
  // actually paint (Overlayer.highlight with a CSS color at .3 opacity).
  // show-annotation fires when the user taps a drawn highlight.
  // Keyed by uuid (two highlights may share a CFI) with a value index for
  // foliate's tap events, which only report the CFI value.
  const annotationsByIndex = new Map()
  const annotationsByValue = new Map()   // value -> [a]
  const annotationsByUuid = new Map()    // uuid -> a

  const forget = a => {
    if (!a) return
    if (a.uuid) annotationsByUuid.delete(a.uuid)
    const sameValue = annotationsByValue.get(a.value)
    if (sameValue) {
      const i = sameValue.indexOf(a)
      if (i >= 0) sameValue.splice(i, 1)
      if (sameValue.length === 0) annotationsByValue.delete(a.value)
    }
    const list = annotationsByIndex.get(a.index)
    if (list) {
      const i = list.indexOf(a)
      if (i >= 0) list.splice(i, 1)
    }
  }

  const remember = a => {
    if (a.uuid) annotationsByUuid.set(a.uuid, a)
    const sameValue = annotationsByValue.get(a.value)
    if (sameValue) sameValue.push(a)
    else annotationsByValue.set(a.value, [a])
    const i = a.index
    const cur = annotationsByIndex.get(i)
    if (cur) cur.push(a)
    else if (i != null) annotationsByIndex.set(i, [a])
  }

  view.addEventListener('create-overlay', ({ detail }) => {
    const { index } = detail
    const list = annotationsByIndex.get(index)
    if (list) for (const a of list) view.addAnnotation(a)
  })
  view.addEventListener('draw-annotation', ({ detail }) => {
    const { draw, annotation } = detail
    draw(Overlayer.highlight, { color: annotation.color })
  })
  view.addEventListener('show-annotation', ({ detail }) => {
    const { value } = detail
    const candidates = annotationsByValue.get(value) ?? []
    notify('onReflowAnnotationTap', {
      uuid: candidates[0]?.uuid ?? null,
      value,
    })
  })

  window.docviewSetAnnotations = list => {
    for (const a of list) {
      if (!a.index && a.index !== 0) continue
      remember(a)
    }
    // Sections already rendered (the first one) need a manual pass.
    for (const { index } of view.renderer?.getContents?.() ?? []) {
      const list2 = annotationsByIndex.get(index)
      if (list2) for (const a of list2) view.addAnnotation(a)
    }
  }

  window.docviewAddAnnotation = async ({ value, color, note, uuid }) => {
    const a = { value, color, note, uuid }
    const res = await view.addAnnotation(a)
    a.index = res?.index
    remember(a)
  }

  window.docviewRemoveAnnotation = async arg => {
    const { value, uuid } =
      typeof arg === 'string' ? { value: arg } : arg
    const a = (uuid && annotationsByUuid.get(uuid)) ||
      (annotationsByValue.get(value) ?? [])[0]
    if (!a) return
    await view.addAnnotation(a, true)
    forget(a)
  }

  // Re-color in place: remove the old draw and add the updated annotation
  // (same CFI value, new color) — overlays redraw via draw-annotation.
  window.docviewUpdateAnnotation = async ({ value, color, note, uuid }) => {
    const old = (uuid && annotationsByUuid.get(uuid)) ||
      (annotationsByValue.get(value) ?? [])[0]
    if (old) await view.addAnnotation(old, true)
    const a = { value, color, note, uuid }
    const res = await view.addAnnotation(a)
    a.index = res?.index
    if (old) forget(old)
    remember(a)
  }

  window.docviewShowAnnotation = value =>
    view.showAnnotation((annotationsByValue.get(value) ?? [])[0] ?? { value })

  // Collapse the native text selection after an annotation action.
  window.docviewClearSelection = () => {
    const contents = view.renderer?.getContents?.() ?? []
    for (const { doc } of contents) {
      doc.getSelection?.()?.removeAllRanges?.()
    }
  }

  // Battery hook: programmatically select a run of text in the first
  // rendered section so the selection bridge produces a CFI for the
  // highlight/note flow. Fires selectionchange like a real drag would.
  window.docviewBatterySelect = () => {
    const contents = view.renderer?.getContents?.() ?? []
    if (contents.length === 0) return false
    // Prefer the currently visible section (resume may start mid-book).
    const currentIndex = view.currentLocation?.index
    const target =
      (currentIndex != null
        ? contents.find(c => c.index === currentIndex)
        : null) ?? contents[contents.length - 1]
    if (!target?.doc) return false
    const sel = target.doc.getSelection?.()
    if (!sel) return false
    const walker = target.doc.createTreeWalker(
      target.doc.body,
      NodeFilter.SHOW_TEXT,
    )
    let node
    while ((node = walker.nextNode())) {
      if ((node.textContent ?? '').trim().length >= 80) {
        sel.removeAllRanges()
        const range = target.doc.createRange()
        range.setStart(node, 5)
        range.setEnd(node, Math.min(75, node.textContent.length))
        sel.addRange(range)
        return true
      }
    }
    return false
  }

  view.addEventListener('load', ({ detail }) => {
    const doc = detail.doc
    if (!doc?.head) return
    injectStyles(doc)
    attachSelectionBridge(doc)
  })

  // Text selection → dictionary lookup bridge. foliate renders each section
  // into its own document (iframe contentDoc), so the hook must be attached
  // per 'load' event. Debounced: selectionchange fires continuously while
  // dragging; the settled selection is what reaches Flutter. The CFI range
  // (annotation anchor) travels along — null when the engine cannot
  // serialize the selection (fixed-layout/CBZ).
  const attachSelectionBridge = doc => {
    if (doc.__docviewSelectionHooked) return
    doc.__docviewSelectionHooked = true
    doc.addEventListener('selectionchange', () => {
      clearTimeout(doc.__docviewSelTimer)
      doc.__docviewSelTimer = setTimeout(() => {
        const sel = doc.getSelection?.()
        const text = sel ? String(sel) : ''
        if (!text) return
        let cfi = null
        try {
          const range = sel.getRangeAt(0)
          cfi = fromRange(range)
        } catch (e) {
          cfi = null
        }
        notify('onReflowSelection', { text, cfi })
      }, 350)
    })
  }

  view.addEventListener('relocate', ({ detail }) => {
    notify('onReflowProgress', {
      fraction: detail.fraction ?? null,
      cfi: detail.cfi ?? null,
      tocLabel:
        typeof detail.tocItem?.label === 'string'
          ? detail.tocItem.label.trim()
          : null,
    })
  })

  applyStyles()

  if (goLocation && goLocation !== 'first') {
    await view.init({ lastLocation: goLocation })
  } else if (goFraction) {
    await view.goToFraction(
      Math.max(0, Math.min(1, parseFloat(goFraction) || 0)),
    )
  } else {
    await view.init({ lastLocation: null, showTextStart: false })
  }

}

open()
  .then(() => notify('onReflowReady', { colorMode }))
  .catch(err => {
    showError(err)
    notify('onReflowError', `${err?.name ?? 'Error'}: ${err?.message ?? err}`)
  })

window.docviewToc = async () => {
  const toc = view.toc ?? null
  if (!toc) return null
  const out = []
  // Depth-first walk with depth for indent rendering in the Dart sheet.
  const record = (nodes, depth) => {
    for (const n of nodes) {
      out.push({
        label: typeof n.label === 'string' ? n.label.trim() : '',
        href: n.href?.() ?? null,
        depth,
      })
      if (Array.isArray(n.subitems)) record(n.subitems, depth + 1)
    }
  }
  record(toc, 0)
  return out
}

window.docviewCommand = cmd => {
  switch (cmd) {
    case 'left': return view.goLeft?.()
    case 'right': return view.goRight?.()
    case 'first': return view.goToFraction?.(0)
    case 'fraction':
      return null
    default:
      return null
  }
}
window.docviewGoToFraction = f => view.goToFraction?.(f)
window.docviewGoTo = loc => view.goTo?.(loc)

// --- search bridge ----------------------------------------------------------
let _searchSeq = 0

const excerptOf = e =>
  e == null
    ? { pre: '', hit: '', post: '' }
    : {
        pre: String(e.pre ?? '').slice(-60),
        hit: String(e.match ?? ''),
        post: String(e.post ?? '').slice(0, 60),
      }

window.docviewSearch = async query => {
  const seq = ++_searchSeq
  notify('onReflowSearchStart', { seq })
  const results = []
  try {
    for await (const result of view.search({ query })) {
      if (seq !== _searchSeq) return
      if (result === 'done') break
      if (typeof result.progress === 'number') {
        notify('onReflowSearchProgress', {
          seq,
          count: results.length,
          progress: result.progress,
        })
      } else if (result.subitems) {
        for (const sub of result.subitems) {
          if (sub?.cfi) results.push({ cfi: sub.cfi, ...excerptOf(sub.excerpt) })
        }
      } else if (result.cfi) {
        results.push({ cfi: result.cfi, ...excerptOf(result.excerpt) })
      }
    }
  } catch (err) {
    if (seq !== _searchSeq) return
    notify('onReflowSearchResults', {
      seq,
      failed: String(err?.message ?? err),
      count: 0,
      results: [],
    })
    return
  }
  if (seq !== _searchSeq) return
  notify('onReflowSearchResults', {
    seq,
    failed: null,
    count: results.length,
    results: results.slice(0, 800),
  })
}

window.docviewClearSearch = () => {
  _searchSeq++
  view.clearSearch?.()
}
</script>
</body>
</html>
